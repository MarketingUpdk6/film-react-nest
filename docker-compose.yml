services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: ghcr.io/marketingupdk6/film-react-nest:backend
    restart: unless-stopped
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://database:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: "3000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/marketingupdk6/film-react-nest:frontend
    restart: "on-failure"
    volumes:
      - frontend_data:/frontend

  nginx:
    build:
      context: ./nginx
    image: ghcr.io/marketingupdk6/film-react-nest:nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend_data:/frontend:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      database:
        condition: service_healthy

volumes:
  database_data:
  frontend_data:
  pgadmin_data: