name: Сборка и публикация Docker-образов

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4
      - name: Подготовить Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Войти в GitHub Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и опубликовать бэкенд
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/marketingupdk6/film-react-nest:backend

      - name: Собрать и опубликовать фронтенд
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/marketingupdk6/film-react-nest:frontend

      - name: Собрать и опубликовать Nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ghcr.io/marketingupdk6/film-react-nest:nginx